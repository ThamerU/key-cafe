<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07545b" />
    <meta name="description" content="Browse Key Café’s sandwiches, desserts, coffee and drinks." />
    <title>Main Menu | Key Café</title>
    <link rel="stylesheet" crossorigin href="../assets/styles-CrhLDNqc.css">
  </head>
  <body>
    <main class="link-page menu-page">
      <a class="menu-back" href="../">← Back to Key Café</a>
      <header class="brand">
        <img src="../assets/key-logo.png" alt="Key Café" width="180" height="126" />
        <h1>Main Menu <span aria-hidden="true">·</span> <span lang="ar" dir="rtl">القائمة الرئيسية</span></h1>
      </header>
      <nav class="menu-jumps" aria-label="Menu sections">
        <a class="link-card" href="#food">Sandwiches &amp; Desserts</a>
        <a class="link-card" href="#drinks">Coffee &amp; Drinks</a>
      </nav>
      <section class="menu-sheet" id="food" aria-labelledby="food-heading">
        <h2 id="food-heading">Sandwiches &amp; Desserts</h2>
        <a href="../assets/menu/food.jpg" aria-label="Open full-size sandwiches and desserts menu">
          <img src="../assets/menu/food.jpg" alt="Key Café’s sandwiches and desserts menu, with prices in Saudi riyals" width="1080" height="1920" />
        </a>
      </section>
      <section class="menu-sheet" id="drinks" aria-labelledby="drinks-heading">
        <h2 id="drinks-heading">Coffee &amp; Drinks</h2>
        <a href="../assets/menu/drinks.jpg" aria-label="Open full-size coffee and drinks menu">
          <img src="../assets/menu/drinks.jpg" alt="Key Café’s cold coffee, cold drinks and hot drinks menu, with prices in Saudi riyals" width="1080" height="1920" loading="lazy" />
        </a>
      </section>
    </main>
  </body>
</html>
